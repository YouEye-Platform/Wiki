apiVersion: v1
kind: app
integration: native
version: 0.5.1
surfaceSchemaVersion: 1
metadata:
  id: "wiki"
  name: "Wiki"
  description: "Privacy-friendly Wikipedia reader. Browse articles, search, and discover featured content — all proxied through your server."
  icon: "book-open"
  category: "productivity"
  website: "https://github.com/YouEye-Platform/Wiki"
  tags: ["wikipedia", "privacy", "reading", "native"]
  defaultSubdomain: "wiki"

detail:
  longDescription: |
    Wiki is a privacy-friendly Wikipedia reader that proxies all requests through your YouEye server.
    Browse articles, search across 300+ Wikipedia languages, and discover featured content without
    exposing your reading habits to third parties. Supports dark mode and integrates with YouEye SSO.
  screenshots:
    - path: "assets/screenshots/1.png"
      caption: "Article view with dark mode"
    - path: "assets/screenshots/2.png"
      caption: "Search across Wikipedia languages"

capabilities:
  widgets: true
  settings_panel: true

surfaces:
  - id: default-notification
    kind: notification
    placement: notification-center
    name: Wiki notification
    description: Rich Wiki notification body
    embedPath: /embed/notification/default
    permissions:
      - notifications:send
  - id: app-settings
    kind: settings-panel
    placement: app-settings
    name: App Settings
    description: App-owned settings panel
    embedPath: /embed/settings
    permissions: []
  - id: featured-article
    kind: widget
    placement: dashboard
    name: Featured Article
    description: Today's featured Wikipedia article
    embedPath: /embed/widget/featured-article
    permissions: []
    defaultSize:
      width: 25
      height: 28
    minSize:
      width: 18
      height: 20
    maxSize:
      width: 45
      height: 50
    refreshInterval: 86400
  - id: today-in-history
    kind: widget
    placement: dashboard
    name: Today in History
    description: Historical events that happened on this day
    embedPath: /embed/widget/today-in-history
    permissions: []
    defaultSize:
      width: 25
      height: 28
    minSize:
      width: 18
      height: 20
    maxSize:
      width: 45
      height: 50
    refreshInterval: 86400
  - id: article-summary
    kind: info-card
    placement: timeline
    name: Article summary
    description: Wikipedia article summary card
    embedPath: /embed/card/article
    permissions: []
    triggers:
      - wikipedia.org
  - id: wiki-article-read
    kind: timeline-card
    placement: timeline
    name: Article read
    description: Wikipedia article read
    embedPath: /embed/timeline/article
    permissions:
      - timeline:write
    triggers:
      - wiki-article-read
  - id: wiki-article-edit
    kind: timeline-card
    placement: timeline
    name: Article edited
    description: Wikipedia article edited
    embedPath: /embed/timeline/article
    permissions:
      - timeline:write
    triggers:
      - wiki-article-edit

wants: []
internet:
  proxy:
    - host: "*.wikipedia.org"
      paths:
        - /api/rest_v1/*
        - /w/api.php*
      methods:
        - GET
    - host: upload.wikimedia.org
      paths:
        - /*
      methods:
        - GET

database:
  mode: none

containers:
  - name: main
    type: lxd
    image: debian/12
    port: 3000
    primary: true
    network: isolated
    source:
      repo: potemsla/YE-App-Wiki
      nodeVersion: "22.x"
      appDir: /opt/app
    healthCheck:
      type: http
      path: /api/health
      timeout: 120000

secrets:
  - name: jwt_secret
    file: .jwt_secret
    generator: secretKey
    length: 64

backup:
  strategy: "stop-dump-export"
  volumes: []

sso:
  type: oauth2
  callback_path: /api/auth/callback
  setup:
    method: env

env_mapping:
  JWT_SECRET: "${secrets.jwt_secret}"
  IDENTITY_URL: "${identity.externalUrl}"
  IDENTITY_INTERNAL_URL: "${identity.internalUrl}"
  IDENTITY_CLIENT_ID: "${sso.client_id}"
  IDENTITY_CLIENT_SECRET: "${sso.client_secret}"
  APP_URL: "${app.url}"
  WIKI_EXTERNAL_URL: "${app.url}"
  YOUEYE_GATEWAY: "${integration.gateway_url}"
  YOUEYE_APP_TOKEN: "${integration.app_token}"
  YOUEYE_APP_ID: "${app.id}"
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

update:
  strategy: replace
  preserveData: true
  preserveSecrets: true
